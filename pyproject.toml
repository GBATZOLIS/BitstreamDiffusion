[project]
name = "bitstream-diffusion"
version = "0.1.0"
description = "Continuous bitstream diffusion across text, image, audio, and proteins."
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy==1.26.4",
    "scipy>=1.11",
    "tqdm>=4.66",
    "filelock>=3.13",
    "ml-collections>=0.1.1",
    "omegaconf>=2.3",
    "einops>=0.7",
    "huggingface-hub>=0.23,<1",
    "transformers>=4.40,<4.50",
    "tokenizers>=0.19",
    "datasets>=2.18,<3",
    "accelerate>=0.30,<1",
    "tensorboard>=2.15",
    "wandb>=0.16",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
eval = [
    "mauve-text>=0.4.0",
]
mnist-sum = [
    "gdown>=5.1",
]
text = [
    "gensim>=4.3",
]
text-audio = [
    "torchaudio==2.7.1",
    "tiktoken==0.13.0",
    "librosa>=0.10",
    "soundfile>=0.12",
]
protein-eval = [
    "pytorch-lightning==2.2.0",
    "torchmetrics>=1.3",
    "hydra-core>=1.3,<1.4",
    "fair-esm==2.0.0",
    "biopython>=1.83",
    "biotite>=0.39",
    "pandas>=2,<3",
    "scikit-learn>=1.4",
    "rich>=13",
    "pyrootutils>=1.0",
    "python-dotenv>=1.0",
    "dm-tree>=0.1.8",
    "e3nn>=0.5,<0.6",
    "peft==0.11.1",
    "tmtools>=0.2",
    "mdtraj>=1.9,<1.11",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "pydssp>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[tool.uv]
package = false
default-groups = []

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.sources.torch]]
index = "pytorch-cu126"
marker = "sys_platform == 'linux' or sys_platform == 'win32'"

[[tool.uv.sources.torchvision]]
index = "pytorch-cu126"
marker = "sys_platform == 'linux' or sys_platform == 'win32'"

[[tool.uv.sources.torchaudio]]
index = "pytorch-cu126"
marker = "sys_platform == 'linux' or sys_platform == 'win32'"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    ".trentinium",
    "external",
    "datasets",
    ".venv",
    ".venvs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E741"]

[tool.ruff.lint.isort]
known-first-party = [
    "data",
    "models",
    "diffusion",
    "trainers",
    "utils",
    "evaluation",
    "configs",
    "scripts",
    "autoregression",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]
"evaluation/evaluation_drivers/proteins/*.py" = ["E402"]
